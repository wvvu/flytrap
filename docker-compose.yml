# One process, three roles. Secrets stay in .env and are not baked into the image.
# Copy .env.example to .env and set API_PASSWORD plus SESSION_SECRET (32+ bytes).
# CLASSIFIER=fake boots without an LLM. openai-compat also needs the three OPENAI_* keys.
# Inside the container the API listens on 0.0.0.0 so the published port can reach it.
# On the host the panel is loopback only. SMTP 2525 is the public intake.
# The entrypoint chowns ./data to uid 1000 and execs as node with an empty capability set.
# The session cookie is Secure when NODE_ENV=production, so the panel needs HTTPS
# in front of 127.0.0.1:8080. /healthz does not.

name: flytrap

services:
  flytrap:
    build: .
    image: flytrap:0.3.0
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MAIL_DATA_DIR: /srv/mail/data
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: "2525"
    ports:
      - "2525:2525"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/srv/mail/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

